<!-- 사이드바 접기/펼치기: 스타일을 페이지에 직접 넣어 main.css 캐시와 무관하게 동작 -->
<style>
  /* 화면 왼쪽 가장자리의 작은 손잡이(표식만) */
  .sidebar-toggle {
    position: fixed;
    top: 140px;
    left: 0;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 44px;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0 6px 6px 0;
    color: inherit;
    background: rgba(128, 128, 128, 0.22);
    opacity: 0.65;
    cursor: pointer;
    transition: opacity 0.2s ease-in-out, background 0.2s ease-in-out;
  }
  .sidebar-toggle:hover,
  .sidebar-toggle:focus-visible {
    opacity: 1;
    background: rgba(128, 128, 128, 0.45);
  }
  /* 화살표 모양: 열린 상태 ‹ (접기), 접힌 상태 › (펼치기) */
  .sidebar-toggle::before {
    content: "";
    width: 6px;
    height: 6px;
    border-left: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: translateX(2px) rotate(45deg);
  }
  html.sidebar-collapsed .sidebar-toggle::before {
    transform: translateX(-2px) rotate(-135deg);
  }
  /* 접힌 상태 */
  html.sidebar-collapsed .sidebar {
    display: none;
  }
  /* 손잡이와 본문 사이 여백 (본문과 상단 경로의 왼쪽 선을 함께 맞춤) */
  html.sidebar-collapsed #main,
  html.sidebar-collapsed .breadcrumbs {
    padding-left: 2em;
  }
  @media (min-width: 1024px) {
    html.sidebar-collapsed .page,
    html.sidebar-collapsed .archive {
      width: 100%;
      padding-right: 0;
    }
    html.sidebar-collapsed .breadcrumbs ol {
      width: 100%;
    }
  }
</style>

<!-- 사이드바 접힘 상태를 첫 렌더링 전에 복원 (깜빡임 방지) -->
<script>
  try {
    if (localStorage.getItem('sidebar-collapsed') === '1') {
      document.documentElement.classList.add('sidebar-collapsed');
    }
  } catch (e) {}
</script>
